---
name: Searching for secrets

on:
  workflow_call:

permissions:
  contents: read

env:
  TRUFFLEHOG_VERSION: '3.99.4'

jobs:
  TruffleHog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: TruffleHog | Install
        uses: supplypike/setup-bin@v5
        with:
          uri: https://github.com/trufflesecurity/trufflehog/releases/download/v${{ env.TRUFFLEHOG_VERSION }}/trufflehog_${{ env.TRUFFLEHOG_VERSION }}_linux_amd64.tar.gz
          name: trufflehog
          version: ${{ env.TRUFFLEHOG_VERSION }}

      - name: TruffleHog | Run
        run: trufflehog git file://./ --fail --results=verified

      - name: Compose Telegram message
        id: message
        if: failure()
        uses: actions/github-script@v9
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const esc = (s) => String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            core.setOutput('text', [
              `❌ <b>${esc(process.env.WORKFLOW_NAME)}</b> has failed`,
              `Repo: <a href="${esc(process.env.REPO_URL)}">${esc(process.env.REPOSITORY)}</a>`,
              `Run: <a href="${esc(process.env.RUN_URL)}">${esc(process.env.RUN_URL)}</a>`,
            ].join('\n'));

      # caller must pass secrets (secrets: inherit) with TELEGRAM_ALERTS_CHAT_ID and TELEGRAM_BOT_TOKEN
      - name: Notify Telegram
        if: failure()
        env:
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEXT: ${{ steps.message.outputs.text }}
        run: |
          curl -sS --fail-with-body \
            --data-urlencode "chat_id=${TELEGRAM_ALERTS_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
